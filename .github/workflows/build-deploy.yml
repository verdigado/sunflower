# .github/workflows/release.yml

name: Build and Deploy

on:
  release:
    types: [published]

env:
  NODE_VERSION: 24

# Needed for the version bump pushed back to main after a release.
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ROOT: ${{ github.workspace }}/sunflower26

    defaults:
      run:
        working-directory: ${{ env.PROJECT_ROOT }}

    if: |
      ${{
        startsWith(github.event.release.tag_name, 'v') &&
        ! ( contains(github.event.release.tag_name, '-alpha') ||
        contains(github.event.release.tag_name, '-beta') ||
        contains(github.event.release.tag_name, '-rc') )
      }}

    steps:
      - uses: actions/checkout@v6
        with:
            path: sunflower26
            # create-changelog.php reads git tag and git log, so it needs the
            # full history including tags.
            fetch-depth: 0

      - name: check theme version against tag
        run: |
            THEME_VERSION=$(cat sass/style.scss | grep Version | sed -r 's/version: +//I')
            V="v"
            echo Version in style.scss: $THEME_VERSION
            if [ "$V$THEME_VERSION" != "${{ github.event.release.tag_name }}" ]; then exit 1; fi

      - uses: actions/setup-node@v6
        with:
            node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules directory
        uses: actions/cache@v5
        id: npm-cache-dir
        with:
            path: node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
                ${{ runner.os }}-node-

      - name: Install npm packages
        if: steps.npm-cache-dir.outputs.cache-hit != 'true'
        run: npm install

      - name: Build CSS
        run: npm run compile:build

      - name: Build CSS-RTL
        run: npm run compile:rtl

      - name: Build Editor CSS
        run: npm run compile:editor

      - name: Build JS
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: run install composer
        run: |
            composer install
            cd lib && composer install

      - name: Run PHPCS checks
        id: phpcs
        continue-on-error: true
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml .

      - name: Show PHPCS results in PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml

      - name: Make bundle
        run: npm run bundle

      - name: fail on fork
        if: github.repository_owner != 'verdigado'
        run: exit 1

      - name: Rename ZIP file
        run: |
            mv ../sunflower26.zip sunflower-${{ github.event.release.tag_name }}.zip

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
            artifacts: '${{ env.PROJECT_ROOT }}/sunflower-${{ github.event.release.tag_name }}.zip'
            makeLatest: true
            prerelease: false
            allowUpdates: true
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide deploy_key
        env:
            DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            SSH_USER: 'github-ci'
            SSH_HOST: 'wordpress05.gcms.verdigado.net'
        run: |
            mkdir "$HOME/.ssh"
            echo "$DEPLOY_KEY" > "$HOME/.ssh/production.key"
            chmod 600 "$HOME/.ssh/production.key"
            cat >> ~/.ssh/config <<END
            Host production
              HostName $SSH_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/production.key
              StrictHostKeyChecking no
            END

      - name: save version
        run: echo ${{ github.event.release.tag_name }} > version.txt

      - name: rsync zipfile, version and changelog
        env:
            PAGEID: 7
        run: |
            rsync -a sunflower-${{ github.event.release.tag_name }}.zip version.txt changelog.html production:/var/www/updateserver/sunflower26/
            THEME_VERSION=$(cat version.txt | sed -e 's/^v//')
            sudo locale-gen de_DE.UTF-8
            THEME_UPDATE=$(LANG=de_DE.UTF-8 && date +'%B %Y')
            ssh production "cd /var/www && wp post get $PAGEID --field=content --url=sunflower-theme.de/ | sed -e 's/<version>[^<]*/<version>$THEME_VERSION/g' | sed -e 's/<versionupdate>[^<]*/<versionupdate>$THEME_UPDATE/g' | sed -E 's/\/updateserver\/sunflower26\/sunflower-v(.*)\.zip/\/updateserver\/sunflower26\/sunflower-v$THEME_VERSION.zip/g' > /tmp/content-$PAGEID.txt"
            ssh production "cd /var/www && wp post update $PAGEID - < /tmp/content-$PAGEID.txt --url=sunflower-theme.de/"
            ssh production "cd /var/www && wp menu item update 147 --url=https://sunflower-theme.de/demo --link=https://sunflower-theme.de/updateserver/sunflower26/sunflower-v$THEME_VERSION.zip"
            ssh production "cd /var/www && rm -fr wp-content/themes/sunflower26/ && wp theme install updateserver/sunflower26/sunflower-v$THEME_VERSION.zip >> /tmp/sunflower-install.log"

      # The release tag points at a commit that already carries the released
      # version, because main is kept one patch level ahead. Move it on again so
      # the next release can be cut from main without editing anything by hand.
      # The "Bump ..." message is filtered out of the changelog by
      # create-changelog.php.
      - name: Bump main to next patch version
        run: |
            # checkout@v6 leaves us on the tag in detached HEAD with a narrow
            # refspec, so origin/main may not exist as a tracking ref.
            git fetch origin main
            git checkout -B main FETCH_HEAD
            git reset --hard FETCH_HEAD
            CURRENT=$(grep -i '^Version' sass/style.scss | sed -r 's/Version:\s*//I')
            NEXT=$(echo "$CURRENT" | awk -F. -v OFS=. '{ $NF += 1; print }')
            echo "Bumping version $CURRENT -> $NEXT"
            sed -i "s/Version.*/Version: $NEXT/" sass/style.scss
            php create-changelog.php
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sass/style.scss changelog.html
            git commit -m "Bump version to $NEXT"
            git push origin main

  mkdocs:
    runs-on: ubuntu-latest
    needs: build-deploy
    steps:
      - uses: actions/checkout@v6

      - name: mkdocs build
        uses: Tiryoh/actions-mkdocs@v0
        with:
            mkdocs_version: 'latest' # option
            # mkdocs_version: '1.1' # option
            requirements: 'mkdocs/requirements.txt' # option
            configfile: 'mkdocs/mkdocs.yml' # option

      - name: Provide deploy_key
        env:
            DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
            SSH_USER: 'github-ci'
            SSH_HOST: 'wordpress05.gcms.verdigado.net'
        run: |
            mkdir "$HOME/.ssh"
            echo "$DEPLOY_KEY" > "$HOME/.ssh/production.key"
            chmod 600 "$HOME/.ssh/production.key"
            cat >> ~/.ssh/config <<END
            Host production
              HostName $SSH_HOST
              User $SSH_USER
              IdentityFile ~/.ssh/production.key
              StrictHostKeyChecking no
            END

      - name: rsync documentation
        run: rsync -a --delete documentation/* production:/var/www/documentation26/
